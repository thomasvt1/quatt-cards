name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This image already includes the shared libraries needed by headless Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # build includes tsc --noEmit; avoid checking the same sources twice.
      - run: npm run build
      - run: npm run check:examples
      # Avoid APT updates/font installs and downloading the unused headed browser.
      - name: Install headless Chromium
        run: npx playwright install --only-shell chromium
        timeout-minutes: 2
      - run: npm run test:coverage
      - run: npm run update:examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: |
            coverage/data/
            coverage/browser/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
          retention-days: 7
