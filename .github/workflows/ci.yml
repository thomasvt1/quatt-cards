name: Browser suite benchmark

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Commit with the Playwright suite to compare
        default: 75ae417a0876a62d03b1ba95a4bc13681b7a885c
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json
      - run: npm ci
        working-directory: baseline
      - run: npm ci
        working-directory: candidate
      - run: npx playwright install --only-shell chromium
        working-directory: candidate
        timeout-minutes: 2
      - name: Compare three complete coverage runs per runner
        run: node candidate/scripts/benchmark-browser.mjs baseline candidate
        env:
          BENCHMARK_OUTPUT: benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-suite-benchmark
          path: benchmark-results/
          retention-days: 14
